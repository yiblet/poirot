name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_call:
    inputs:
      all-builds:
        description: Run the feature matrix before publishing
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked
      - name: Test release tools
        run: |
          python3 tools/test_package_contents.py
          python3 tools/test_release.py
          python3 tools/test_set_release_version.py
      - name: Check architecture and authored specifications
        run: |
          python3 tools/test_function_architecture.py
          python3 tools/test_coercion_architecture.py
          python3 tools/test_module_layout.py
          python3 tools/test_eval_dependencies.py
          python3 tools/test_error_patterns.py --self-test
          python3 tools/test_error_patterns.py
          python3 crates/poirot-test-excel-specs/tools/maintain.py --check

  build-matrix:
    name: Configure builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select build configurations
        id: matrix
        env:
          ALL_BUILDS: >-
            ${{ inputs.all-builds == true ||
                contains(github.event.pull_request.labels.*.name, 'release') ||
                contains(github.event.pull_request.labels.*.name, 'all-builds') }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          builds = [{
              "name": "MSRV",
              "os": "ubuntu-latest",
              "toolchain": "1.90.0",
              "command": "check",
              "flags": "--all-features",
          }]
          if os.environ["ALL_BUILDS"] == "true":
              for name, flags in [
                  ("no default features", "--no-default-features"),
                  ("all features", "--all-features"),
              ]:
                  builds.append({
                      "name": name,
                      "os": "ubuntu-latest",
                      "toolchain": "stable",
                      "command": "test",
                      "flags": flags,
                  })
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": builds}) + "\n")
          PYTHON

  features:
    name: Builds (${{ matrix.name }})
    needs: build-matrix
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - name: Build workspace
        run: cargo ${{ matrix.command }} --workspace ${{ matrix.flags }} --locked
