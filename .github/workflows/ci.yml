name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    concurrency:
      group: ${{ github.workflow }}-quality-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test release tools
        run: |
          python3 tools/test_package_contents.py
          python3 tools/test_release.py
          python3 tools/test_set_release_version.py
          python3 tools/test_release_workflows.py
      - name: Check architecture and authored specifications
        run: |
          python3 tools/test_function_architecture.py
          python3 tools/test_coercion_architecture.py
          python3 tools/test_module_layout.py
          python3 tools/test_eval_dependencies.py
          python3 tools/test_error_patterns.py --self-test
          python3 tools/test_error_patterns.py
          python3 crates/poirot-test-excel-specs/tools/maintain.py --check
