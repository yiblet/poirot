name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked
      - name: Test release tools
        run: |
          python3 tools/test_package_contents.py
          python3 tools/test_release.py
      - name: Verify release archives
        env:
          RUSTDOCFLAGS: -D warnings
        run: python3 tools/verify_release.py --offline
      - name: Check architecture and authored specifications
        run: |
          python3 tools/test_function_architecture.py
          python3 tools/test_coercion_architecture.py
          python3 tools/test_module_layout.py
          python3 tools/test_eval_dependencies.py
          python3 tools/test_error_patterns.py --self-test
          python3 tools/test_error_patterns.py
          python3 crates/poirot-test-excel-specs/tools/maintain.py --check

  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.90.0
    steps:
      - uses: actions/checkout@v7
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Check MSRV
        run: cargo check --workspace --all-features --locked
