name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Match the tag to every production crate version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          metadata = json.loads(subprocess.check_output([
              'cargo', 'metadata', '--no-deps', '--locked', '--format-version', '1',
          ]))
          tag = os.environ['RELEASE_TAG']
          for package in metadata['packages']:
              if package['id'] not in metadata['workspace_members'] or package['publish'] == []:
                  continue
              expected = 'v' + package['version']
              if tag != expected:
                  raise SystemExit(f"{package['name']}: expected tag {expected}, got {tag}")
          PY

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Publish production crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RUSTUP_TOOLCHAIN: stable
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo 'CARGO_REGISTRY_TOKEN secret is missing'; exit 1; }
          python3 tools/verify_release.py --order > "$RUNNER_TEMP/publish-order.txt"
          while read -r package version; do
            cargo publish -p "$package" --locked
          done < "$RUNNER_TEMP/publish-order.txt"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Poirot $RELEASE_TAG"
