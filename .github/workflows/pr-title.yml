name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          title = event['pull_request']['title']
          types = 'build|chore|ci|docs|feat|fix|perf|ref|revert|style|test'
          pattern = rf'({types})(\([^()\s]+\))?!?: \S[^\r\n]*'
          if re.fullmatch(pattern, title) is None or title != title.rstrip():
              raise SystemExit(
                  'PR title must use type(scope): description or type: description; '
                  'an optional ! before the colon marks a breaking change. '
                  f'Allowed types: {types.replace("|", ", ")}. '
                  'Example: fix(eval): handle empty ranges'
              )
          PY
