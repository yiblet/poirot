name: Rust tests

on:
  push:
    branches: [master]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  workflow_dispatch:
    inputs:
      all-builds:
        description: Run the complete feature matrix
        type: boolean
        default: false
  workflow_call:
    inputs:
      all-builds:
        description: Run the complete feature matrix
        type: boolean
        default: false
      ref:
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Formatting, Clippy, and rustdoc
    if: github.event.action != 'labeled'
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  build-matrix:
    name: Configure builds
    runs-on: ubuntu-latest
    env:
      ALL_BUILDS: >-
        ${{ inputs.all-builds == true ||
            contains(github.event.pull_request.labels.*.name, 'release') ||
            contains(github.event.pull_request.labels.*.name, 'all-builds') }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select build configurations
        id: matrix
        env:
          LABEL_EXPANSION: ${{ github.event.action == 'labeled' }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          features = [("default features", "")]
          if os.environ["ALL_BUILDS"] == "true":
              if os.environ["LABEL_EXPANSION"] == "true":
                  features = []
              features += [
                  ("no default features", "--no-default-features"),
                  ("all features", "--all-features"),
              ]
          builds = [
              {
                  "name": f"{rust} / {feature}",
                  "os": "ubuntu-latest",
                  "toolchain": toolchain,
                  "flags": flags,
              }
              for rust, toolchain in [("stable", "stable"), ("MSRV", "1.90.0")]
              for feature, flags in features
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": builds}) + "\n")
          PYTHON

  features:
    name: Builds (${{ matrix.name }})
    needs: build-matrix
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.event.pull_request.number || github.ref }}-${{ matrix.toolchain }}-${{ matrix.flags }}
      cancel-in-progress: true
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - name: Test workspace
        run: cargo test --workspace ${{ matrix.flags }} --locked
