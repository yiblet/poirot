version: 2
updates:
  - package-ecosystem: cargo
    labels: []
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      cargo-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      cargo-security-updates:
        applies-to: security-updates
        patterns: ["*"]
  # Grouped Cargo updates drop parent manifests needed by these path dependencies.
  # Keep shared version changes in the root job and refresh benchmark locks separately.
  - package-ecosystem: cargo
    labels: []
    directories:
      - /benchmarks/rust
      - /benchmarks/storage-layout
      - /benchmarks/incremental-replay
    versioning-strategy: lockfile-only
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    labels: []
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      actions-security-updates:
        applies-to: security-updates
        patterns: ["*"]
