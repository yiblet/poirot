version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /benchmarks/rust
      - /benchmarks/storage-layout
      - /benchmarks/incremental-replay
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      cargo-version-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      cargo-security-updates:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      actions-security-updates:
        applies-to: security-updates
        patterns: ["*"]
