[package]
name = "poirot-functions"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Workbook-independent spreadsheet functions, coercion, and display formatting"
include = ["/src/**", "/README.md", "/LICENSES/**"]

[features]
pcre2 = ["dep:pcre2"]

[dependencies]
thiserror = { workspace = true }
roxmltree.workspace = true
statrs = { workspace = true }
libm = { workspace = true }
bigdecimal = { workspace = true }
poirot-parsing = { version = "0.1.2", path = "../poirot-parsing" }
smallvec = { workspace = true }
serde = { workspace = true }
unicode-general-category = "1.1.0"
pcre2 = { workspace = true, optional = true }
nom = { workspace = true }
regex = { workspace = true }
num-bigint = { workspace = true }
sxd-document = "=0.3.2"
sxd-xpath = "=0.4.2"


[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
