[workspace]
members = ["crates/*"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/yiblet/poirot"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
enum_glob_use = "deny"
wildcard_imports = "deny"

[workspace.dependencies]
allocation-counter = "0.8.1"
smallvec = "1.16.3"
num-bigint = "0.4.8"
bigdecimal = "0.4.11"
statrs = { version = "0.19.1", default-features = false }
libm = "0.2.16"
regex = "1.13.1"
pcre2 = "0.2.11"
nom = "8.0.0"
serde_json = "1.0.154"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
sha2 = "0.11.1"
cfb = "0.15.0"
quick-xml = "0.42.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
calamine = "=0.37.0"
rxls = { version = "=0.1.4", default-features = false, features = ["xlsx"] }
rayon = "1.12.0"
roxmltree = "0.21.1"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }

[package]
name = "poirot"
autotests = false
version.workspace = true
edition.workspace = true
description = "Read, edit, evaluate and write Excel workbooks"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["/src/**", "/examples/**", "/README.md", "/CONTRIBUTING.md", "/docs/compatibility.md", "/docs/resources.md", "/docs/evaluation.md", "/docs/architecture.md", "/LICENSES/**"]

[dependencies]
poirot-parsing = { version = "0.1.0", path = "crates/poirot-parsing" }
poirot-io = { version = "0.1.0", path = "crates/poirot-io" }
foldhash = "0.2.0"
# MIT OR Apache-2.0, used under MIT: checksums identify snapshot source sections.
crc32fast = "1.5.0"
serde = { workspace = true }
serde_bytes = "0.11.19"
nom = { workspace = true }
rand_chacha = "0.10.0"
rand_core = "0.10.1"
postcard = { workspace = true }
poirot-functions = { version = "0.1.0", path = "crates/poirot-functions" }

[dev-dependencies]
cfb.workspace = true
calamine.workspace = true
quick-xml.workspace = true
rxls = { workspace = true }
zip = { workspace = true }
allocation-counter = { workspace = true }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
