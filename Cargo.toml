[workspace]
members = ["crates/*"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/yiblet/poirot"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
allocation-counter = "0.8.1"
smallvec = "1.16.2"
num-bigint = "0.4.8"
bigdecimal = "0.4.11"
statrs = { version = "0.19.1", default-features = false }
libm = "0.2.16"
regex = "1.13.1"
nom = "8.0.0"
serde_json = "1.0.151"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
sha2 = "0.10.9"
cfb = "0.15.0"
quick-xml = "0.41.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
calamine = "0.36.1"
rust_xlsxwriter = "0.99.1"
rayon = "1.12.0"
roxmltree = "0.21.1"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }

[package]
name = "poirot"
version.workspace = true
edition.workspace = true
description = "Read, edit, evaluate and write Excel workbooks"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["/src/**", "/examples/**", "/README.md", "/CONTRIBUTING.md", "/LICENSES/**"]

[dependencies]
poirot-workbook = { version = "0.1.0", path = "crates/poirot-workbook" }
poirot-model = { version = "0.1.0", path = "crates/poirot-model" }
poirot-parsing = { version = "0.1.0", path = "crates/poirot-parsing" }
poirot-eval = { version = "0.1.0", path = "crates/poirot-eval" }
poirot-io = { version = "0.1.0", path = "crates/poirot-io" }
poirot-format = { version = "0.1.0", path = "crates/poirot-format" }
poirot-xls = { version = "0.1.0", path = "crates/poirot-xls" }

[dev-dependencies]
postcard.workspace = true

[lints]
workspace = true
