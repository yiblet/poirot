[package]
name = "poirot-incremental-replay"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[workspace.lints.rust]
unsafe_code = "forbid"

[dependencies]
poirot = { path = "../.." }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
poirot-parsing = { path = "../../crates/poirot-parsing" }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
allocation-counter = { version = "=0.8.1", optional = true }

[features]
count-allocations = ["dep:allocation-counter"]

[lints]
workspace = true
