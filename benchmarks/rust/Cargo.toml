[workspace]
members = ["common", "poirot", "ironcalc"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
benchmark-common = { path = "common" }
